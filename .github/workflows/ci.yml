# Every pull request and every push to main. A pull request can only be merged into main
# when the "CI result" check passes (see MANUAL_INSTALL.md, section 6).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Format, lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The build needs these, but no database: every page is rendered on request.
      PAYLOAD_SECRET: ci-build-only
      DATABASE_URL: file:./ci-build.db
      SAMPLE_DATA: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint --format github
      - run: pnpm typecheck
      - run: shellcheck deploy.sh
      - run: pnpm build
      - name: Build finished
        # Next.js can exit 0 without building, when the pinned version has a security
        # advisory ("Upgrade: Next.js ..."). deploy.sh checks the same file.
        run: |
          test -f .next/BUILD_ID || {
            echo "::error::pnpm build exited without .next/BUILD_ID. Look for 'Upgrade: Next.js' above."
            exit 1
          }
      - name: Generated files are committed
        # The build regenerates these; commit them after changing a collection or an admin component.
        run: |
          git diff --exit-code -- src/payload-types.ts 'src/app/(payload)/admin/importMap.js'
          test -z "$(git status --porcelain --untracked-files=no)"

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:unit
      - run: pnpm test:integration

  out_of_box:
    name: out_of_box (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Only runs the script; deploy.sh installs its own Node.js into .venv, as for a new user.
      # No caches: this job tests what a new user gets.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/ci/out_of_box.mjs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: out_of_box-log-${{ matrix.os }}
          path: out_of_box.log

  ci-result:
    name: CI result
    if: always()
    needs: [checks, tests, out_of_box]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "$NEEDS"
          [ "$FAILED" = "false" ]
